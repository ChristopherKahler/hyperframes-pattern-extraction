[project]
name = "video-use"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
animations = ["manim"]
# Local transcription stack. Replaces ElevenLabs Scribe with WhisperX +
# pyannote. Heavy install (torch + ctranslate2 + pyannote models).
local = [
    "whisperx>=3.1.1",
    "torch>=2.0",
    "torchaudio>=2.0",
    "ctranslate2>=4.0",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
